name: Verificar previa
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar configuracao e autenticacao
        run: node --test tests/*.test.mjs
      - name: Instalar dependencias fixadas
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - name: Compilar sem publicar
        run: npx --yes pnpm@11.25.0 run build
